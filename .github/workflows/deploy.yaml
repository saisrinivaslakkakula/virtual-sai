name: 🚀 Deploy to RunPod

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: 🧾 Checkout Code
              uses: actions/checkout@v3

            - name: 🔐 Set Up SSH Access
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.RUNPOD_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_HOST }} >> ~/.ssh/known_hosts

            - name: 🚀 Deploy & Launch in RunPod
              run: |
                  ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_USER }}@${{ secrets.RUNPOD_HOST }} << 'EOF'

                  set -e

                  echo "📁 Navigating to volume mount at /workspace"
                  cd /workspace

                  export REPO_DIR=/workspace/virtual-sai
                  export VENV_DIR=\$REPO_DIR/venv
                  export OLLAMA_MODELS=/workspace/.ollama
                  export PATH=\$VENV_DIR/bin:\$PATH

                  echo "📂 Ensuring repo exists"
                  if [ ! -d "\$REPO_DIR/.git" ]; then
                      git clone https://github.com/saisrinivaslakkakula/virtual-sai.git \$REPO_DIR
                  else
                      cd \$REPO_DIR && git pull origin main
                  fi

                  cd \$REPO_DIR

                  echo "🧹 Removing old virtual environment (if any)..."
                  [ -d "\$VENV_DIR" ] && rm -rf \$VENV_DIR || echo "No venv to remove"

                  echo "🐍 Creating virtual environment"
                  python3 -m venv \$VENV_DIR
                  source \$VENV_DIR/bin/activate

                  echo "📦 Installing requirements..."
                  pip install --upgrade pip
                  pip install -r requirements.txt

                  echo "🧠 Preparing Ollama..."
                  mkdir -p \$OLLAMA_MODELS
                  export OLLAMA_MODELS=\$OLLAMA_MODELS

                  if ! pgrep -f "ollama serve" > /dev/null; then
                      echo "🚀 Starting Ollama..."
                      nohup ollama serve > ollama.log 2>&1 &
                      sleep 3
                  else
                      echo "✅ Ollama already running"
                  fi

                  echo "🤖 Pulling mistral model (if not present)..."
                  ollama pull mistral || echo "⚠️ Mistral model pull skipped or failed"

                  echo "🛑 Stopping previous services"
                  pkill streamlit || true
                  pkill cloudflared || true

                  echo "🚀 Launching Streamlit..."
                  nohup streamlit run app.py --server.port=7860 --server.address=0.0.0.0 > streamlit.log 2>&1 &

                  echo "🌐 Launching Cloudflare tunnel..."
                  nohup cloudflared tunnel --url http://localhost:7860 > cloudflare.log 2>&1 &

                  echo "⏳ Waiting for Cloudflare to initialize..."
                  sleep 5  # Give it time to generate the tunnel

                  echo "🌐 Extracting public URL..."
                  URL=\$(awk '/trycloudflare/ {print \$NF}' cloudflare.log | tail -n1)

                  if [ -n "\$URL" ]; then
                      echo "✅ Public URL: \$URL"
                  else
                      echo "❌ Tunnel URL not found. Check cloudflare.log"
                  fi

                  echo "✅ Deployment Complete!"
                  EOF
