name: 🚀 Deploy to RunPod

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: 🧾 Checkout Repository
              uses: actions/checkout@v3

            - name: 🔐 Setup SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.RUNPOD_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_HOST }} >> ~/.ssh/known_hosts

            - name: 🚀 Deploy on RunPod with Full Setup
              run: |
                  ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.RUNPOD_PORT }} -o StrictHostKeyChecking=no ${{ secrets.RUNPOD_USER }}@${{ secrets.RUNPOD_HOST }} << 'EOF'

                  set -e
                  echo "📦 Bootstrapping base system with missing packages..."

                  if ! command -v apt > /dev/null; then
                    echo "❌ apt not found. Please use a base Ubuntu image."
                    exit 1
                  fi

                  apt update && apt install -y \
                    curl unzip git bash coreutils vim ca-certificates \
                    software-properties-common lsb-release python3-pip python3-venv

                  echo "🔁 Starting remote deployment on RunPod..."

                  export REPO_DIR=/workspace/virtual-sai
                  export VENV_DIR=\$REPO_DIR/venv
                  export PATH=\$VENV_DIR/bin:\$PATH

                  echo "📁 Ensuring repo directory exists"
                  mkdir -p \$REPO_DIR && cd \$REPO_DIR

                  echo "🔄 Cloning or pulling latest repo"
                  if [ ! -d ".git" ]; then
                    git clone https://github.com/saisrinivaslakkakula/virtual-sai.git .
                  else
                    git pull origin main
                  fi

                  echo "🧹 Cleaning old venv if exists"
                  rm -rf \$VENV_DIR || true

                  echo "🐍 Creating new venv"
                  python3 -m venv \$VENV_DIR
                  source \$VENV_DIR/bin/activate

                  echo "📦 Installing Python requirements"
                  pip install --upgrade pip
                  pip install -r requirements.txt

                  echo "🤖 Checking Ollama..."
                  if ! pgrep -f "ollama" > /dev/null; then
                    echo "🚀 Starting Ollama..."
                    nohup ollama serve > ollama.log 2>&1 &
                    sleep 10
                  else
                    echo "✅ Ollama already running"
                  fi

                  echo "🛑 Killing previous processes"
                  pkill streamlit || true
                  pkill cloudflared || true

                  echo "🚀 Launching Streamlit..."
                  nohup streamlit run app.py --server.port=7860 --server.address=0.0.0.0 > streamlit.log 2>&1 &

                  echo "🌐 Launching Cloudflare tunnel..."
                  nohup cloudflared tunnel --url http://localhost:7860 > cloudflare.log 2>&1 &

                  echo "⏳ Waiting for Cloudflare URL..."
                  for i in {1..10}; do
                    URL=\$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | tail -n1)
                    if [ ! -z "\$URL" ]; then
                      echo "🌍 Public URL: \$URL"
                      break
                    fi
                    sleep 2
                  done

                  if [ -z "\$URL" ]; then
                    echo "❌ Failed to extract Cloudflare URL"
                  fi

                  echo "✅ Deployment complete!"
                  EOF
