name: 🚀 Deploy to RunPod

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: 🧾 Checkout Code
              uses: actions/checkout@v3

            - name: 🔐 Set Up SSH Access
              run: |
                  echo "🔐 Creating SSH directory"
                  mkdir -p ~/.ssh
                  echo "${{ secrets.RUNPOD_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || echo "⚠️ ssh-keyscan failed"

            - name: 🧪 Test SSH
              run: |
                  echo "🔌 Testing SSH..."
                  ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.RUNPOD_PORT }} -o StrictHostKeyChecking=no ${{ secrets.RUNPOD_USER }}@${{ secrets.RUNPOD_HOST }} "echo 🟢 SSH OK" || echo "❌ SSH Failed"

            - name: 🚀 Deploy and Launch on RunPod
              run: |
                  ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_USER }}@${{ secrets.RUNPOD_HOST }} << 'EOF'

                  set -e
                  REPO_DIR=/workspace/virtual-sai

                  echo "🔁 Starting remote deployment on RunPod..."

                  echo "📁 Ensuring repo directory exists"
                  mkdir -p \$REPO_DIR && cd \$REPO_DIR

                  echo "🧹 Cleaning old venv/files..."
                  rm -rf venv /tmp/* ~/.cache || true

                  echo "📥 Syncing source..."
                  if [ ! -d ".git" ]; then
                      git clone https://github.com/saisrinivaslakkakula/virtual-sai.git .
                  else
                      git pull origin main
                  fi

                  echo "🐍 Creating venv"
                  python3 -m venv venv && source venv/bin/activate

                  echo "📦 Installing deps"
                  pip install --upgrade pip
                  pip install -r requirements.txt

                  echo "🤖 Checking if Ollama is installed..."
                    if ! command -v ollama &> /dev/null; then
                        echo "📥 Installing Ollama..."
                        curl -fsSL https://ollama.com/install.sh -o ollama.sh
                        chmod +x ollama.sh
                        ./ollama.sh || { echo "❌ Ollama installation failed"; exit 1; }
                    else
                        echo "✅ Ollama already installed"
                    fi

                    echo "🚀 Starting Ollama server in background..."
                    nohup ollama serve > ollama.log 2>&1 &
                    sleep 3  # Give it a few seconds to boot

                    # Check API health
                    echo "🔍 Waiting for Ollama API to become ready..."
                    OLLAMA_READY=0
                    for i in {1..10}; do
                        if curl -s http://localhost:11434/api/tags > /dev/null; then
                            echo "✅ Ollama is up"
                            OLLAMA_READY=1
                            break
                        else
                            echo "⏳ Still waiting for Ollama..."
                            sleep 2
                        fi
                    done

                    if [ "$OLLAMA_READY" -ne 1 ]; then
                        echo "❌ Ollama did not start in time"
                        tail -n 20 ollama.log || echo "(no ollama logs)"
                        exit 1
                    fi

                    echo "🤖 Pulling mistral..."
                    ollama pull mistral || echo "⚠️ Mistral already exists or pulled earlier"

                  echo "🛑 Killing previous..."
                  pkill streamlit || true
                  pkill cloudflared || true

                  echo "🚀 Launching Streamlit..."
                  nohup streamlit run app.py --server.port=7860 --server.address=0.0.0.0 > streamlit.log 2>&1 &

                  echo "🕒 Waiting for Streamlit..."
                  sleep 5

                  echo "🧠 Checking if Streamlit is running..."
                  if pgrep -f "streamlit run" > /dev/null; then
                      echo "✅ Streamlit is up"
                  else
                      echo "❌ Streamlit failed to start"
                      tail -n 40 streamlit.log || echo "(No logs)"
                      exit 1
                  fi

                  echo "🔍 Checking cloudflared..."
                  if ! command -v cloudflared &> /dev/null; then
                      echo "📥 Installing Cloudflared..."
                      curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
                      chmod +x cloudflared
                      mv cloudflared /usr/local/bin/cloudflared
                  fi

                  echo "🌐 Launching Cloudflare tunnel..."
                  nohup cloudflared tunnel --url http://localhost:7860 > cloudflare.log 2>&1 &

                  echo "📄 Streamlit logs:"
                  tail -n 30 streamlit.log || echo "⚠️ No logs"

                  echo "📄 Cloudflare logs:"
                  tail -n 30 cloudflare.log || echo "⚠️ No logs"

                  echo "✅ Deployment complete. Check cloudflare.log for your tunnel URL"
                  EOF
