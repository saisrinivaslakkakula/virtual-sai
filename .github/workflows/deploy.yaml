name: 🚀 Deploy to RunPod

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: 🧾 Checkout Code
              uses: actions/checkout@v3

            - name: 🔐 Set Up SSH Access
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.RUNPOD_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_HOST }} >> ~/.ssh/known_hosts

            - name: 🚀 Deploy & Launch in RunPod
              run: |
                  ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_USER }}@${{ secrets.RUNPOD_HOST }} << 'EOF'

                  set -e

                  echo "📁 Using persistent volume at /workspace"
                  cd /workspace

                  export REPO_DIR=/workspace/virtual-sai
                  export VENV_DIR=\$REPO_DIR/venv
                  export OLLAMA_MODELS=/workspace/.ollama

                  echo "🧹 Cleanup old venv if exists"
                  [ -d "\$VENV_DIR" ] && rm -rf \$VENV_DIR || echo "No existing venv found"

                  echo "📦 Cloning or pulling latest repo"
                  if [ ! -d "\$REPO_DIR/.git" ]; then
                    git clone https://github.com/saisrinivaslakkakula/virtual-sai.git \$REPO_DIR
                  else
                    cd \$REPO_DIR && git pull origin main
                  fi

                  cd \$REPO_DIR

                  echo "🐍 Creating virtual environment in volume..."
                  python3 -m venv \$VENV_DIR
                  source \$VENV_DIR/bin/activate

                  echo "📦 Installing dependencies"
                  pip install --upgrade pip
                  pip install -r requirements.txt

                  echo "🤖 Ensuring Ollama model directory exists..."
                  mkdir -p \$OLLAMA_MODELS
                  export OLLAMA_MODELS=\$OLLAMA_MODELS

                  if ! pgrep -f "ollama serve" > /dev/null; then
                    echo "🚀 Starting Ollama..."
                    nohup ollama serve > \$REPO_DIR/ollama.log 2>&1 &
                    sleep 3
                  else
                    echo "✅ Ollama already running"
                  fi

                  echo "🧠 Pulling mistral model (if not present)..."
                  ollama pull mistral || echo "⚠️ Pull failed — might already be present"

                  echo "🛑 Killing previous processes"
                  pkill streamlit || true
                  pkill cloudflared || true

                  echo "🚀 Launching Streamlit..."
                  nohup \$VENV_DIR/bin/streamlit run app.py \
                    --server.port=7860 --server.address=0.0.0.0 \
                    > streamlit.log 2>&1 &

                  echo "🌐 Launching Cloudflare tunnel..."
                  nohup cloudflared tunnel --url http://localhost:7860 > cloudflare.log 2>&1 &

                  echo "⏳ Waiting for tunnel to initialize..."
                  for i in {1..15}; do
                    URL=\$(grep -o 'https://[^ ]*trycloudflare.com' cloudflare.log | tail -n1)
                    if [ ! -z "\$URL" ]; then
                      echo "✅ Public URL: \$URL"
                      break
                    fi
                    sleep 2
                  done

                  if [ -z "\$URL" ]; then
                    echo "❌ Tunnel failed to generate public URL"
                  fi

                  echo "✅ Deployment Complete!"
                  EOF
