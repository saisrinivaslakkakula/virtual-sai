name: 🚀 Deploy to RunPod

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: 🧾 Checkout Code
              uses: actions/checkout@v3

            - name: 🔐 Set Up SSH Access
              run: |
                  echo "🔐 Setting up SSH"
                  mkdir -p ~/.ssh
                  echo "${{ secrets.RUNPOD_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_HOST }} >> ~/.ssh/known_hosts

            - name: ⚙️ Install Core Packages on Pod
              run: |
                  echo "🔧 SSH into pod and install dependencies..."
                  ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_USER }}@${{ secrets.RUNPOD_HOST }} << 'INSTALL'
                    set -e
                    sudo apt update
                    sudo apt install -y git curl unzip
                  INSTALL

            - name: 🚀 Full Deployment on Pod
              run: |
                  echo "🚀 Deploying code to RunPod..."
                  ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_USER }}@${{ secrets.RUNPOD_HOST }} << 'DEPLOY'
                    set -e

                    # ──────────── 📁 ENV SETUP ────────────
                    export REPO_DIR=/workspace/virtual-sai
                    export VENV_DIR=\$REPO_DIR/venv
                    export OLLAMA_MODELS=/workspace/.ollama
                    export PATH=\$VENV_DIR/bin:\$PATH

                    echo "📁 Navigating to /workspace"
                    cd /workspace

                    echo "📂 Checking repo..."
                    if [ ! -d "\$REPO_DIR/.git" ]; then
                      git clone https://github.com/saisrinivaslakkakula/virtual-sai.git \$REPO_DIR
                    else
                      cd \$REPO_DIR && git pull origin main
                    fi

                    # ──────────── 🐍 PYTHON SETUP ────────────
                    echo "🧹 Cleaning old venv (if any)"
                    [ -d "\$VENV_DIR" ] && rm -rf \$VENV_DIR

                    echo "🐍 Creating new venv"
                    python3 -m venv \$VENV_DIR
                    source \$VENV_DIR/bin/activate

                    echo "📦 Installing Python requirements"
                    pip install --upgrade pip
                    pip install -r \$REPO_DIR/requirements.txt

                    # ──────────── 🛑 PROCESS CLEANUP ────────────
                    echo "🛑 Killing previous processes"
                    pkill streamlit || true
                    pkill cloudflared || true

                    # ──────────── 🚀 LAUNCH SERVICES ────────────
                    echo "🚀 Launching Streamlit..."
                    nohup streamlit run \$REPO_DIR/app.py --server.port=7860 --server.address=0.0.0.0 > streamlit.log 2>&1 &

                    echo "🌐 Launching Cloudflare tunnel..."
                    nohup cloudflared tunnel --url http://localhost:7860 > cloudflare.log 2>&1 &

                    echo "⏳ Waiting for tunnel to initialize..."
                    for i in {1..10}; do
                      URL=\$(grep -o 'https://.*trycloudflare.com' cloudflare.log | tail -n1)
                      if [ ! -z "\$URL" ]; then
                        echo "🌍 Cloudflare Public URL: \$URL"
                        break
                      fi
                      sleep 2
                    done

                    echo "✅ Deployment complete"
                  DEPLOY
