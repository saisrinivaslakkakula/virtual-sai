name: 🚀 Deploy to RunPod

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: 🧾 Checkout Code
              uses: actions/checkout@v3

            - name: 🐍 Set Up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            - name: 🔐 Debug SSH Setup
              run: |
                  echo "🔍 Creating ~/.ssh directory..."
                  mkdir -p ~/.ssh

                  echo "🔐 Writing SSH key..."
                  echo "${{ secrets.RUNPOD_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519

                  echo "🔍 SSH Key First Few Lines:"
                  head -n 5 ~/.ssh/id_ed25519 || echo "(failed to read key)"

                  echo "🌐 Verifying SSH access to ${{ secrets.RUNPOD_HOST }} on port ${{ secrets.RUNPOD_PORT }}"
                  ssh-keyscan -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_HOST }} >> ~/.ssh/known_hosts || echo "⚠️ ssh-keyscan failed"

                  echo "📂 Known hosts:"
                  cat ~/.ssh/known_hosts || echo "(no known_hosts)"

            - name: 🧪 Debug Secrets and Env Vars
              run: |
                  echo "🔍 Checking secret values (redacted):"
                  echo "RUNPOD_HOST: ${{ secrets.RUNPOD_HOST }}"
                  echo "RUNPOD_PORT: ${{ secrets.RUNPOD_PORT }}"
                  echo "RUNPOD_USER: ${{ secrets.RUNPOD_USER }}"
                  echo "Private key preview:"
                  echo "${{ secrets.RUNPOD_SSH_KEY }}" | head -n 5

            - name: 🧪 Verbose SSH Connection Test
              run: |
                  echo "🚀 Attempting SSH connection to RunPod with -vvv..."
                  ssh -vvv -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ${{ secrets.RUNPOD_USER }}@${{ secrets.RUNPOD_HOST }} -p ${{ secrets.RUNPOD_PORT }} "echo 🟢 Connected to RunPod!"

            - name: Deploy Setup and Launch
              run: |
                  echo "📁 Navigating to project directory"
                  ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_USER }}@${{ secrets.RUNPOD_HOST }} << 'EOF'

                  set -e  # Exit on error

                  echo "🧹 Cleaning up old environment"
                  rm -rf ~/virtual-sai/venv || true

                  echo "📥 Pulling latest code"
                  cd ~/virtual-sai
                  git pull origin main

                  echo "🐍 Setting up virtual environment"
                  python3 -m venv venv
                  source venv/bin/activate

                  echo "📦 Installing dependencies"
                  pip install --upgrade pip
                  pip install -r requirements.txt

                  echo "🧠 Starting Streamlit + Ollama + Cloudflare (background)"
                  pkill streamlit || true
                  pkill cloudflared || true
                  nohup streamlit run app.py --server.port=7860 --server.address=0.0.0.0 > streamlit.log 2>&1 &
                  nohup cloudflared tunnel --url http://localhost:7860 > cloudflare.log 2>&1 &

                  echo "✅ Deployment completed!"
                  EOF
