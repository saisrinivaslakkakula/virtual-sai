name: 🚀 Deploy to RunPod

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: 🧾 Checkout Code
              uses: actions/checkout@v3

            - name: 🔐 Set Up SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.RUNPOD_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_HOST }} >> ~/.ssh/known_hosts

            - name: 🚀 Deploy to RunPod
              run: |
                  ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 -p ${{ secrets.RUNPOD_PORT }} ${{ secrets.RUNPOD_USER }}@${{ secrets.RUNPOD_HOST }} <<EOF
                    set -e
                    echo "🧹 Cleaning old venv (if exists)"
                    rm -rf ~/virtual-sai/venv || true

                    echo "📥 Pulling latest code"
                    cd ~/virtual-sai || git clone https://github.com/saisrinivaslakkakula/virtual-sai.git ~/virtual-sai && cd ~/virtual-sai
                    git pull origin main

                    echo "🐍 Creating virtualenv"
                    python3 -m venv venv
                    source venv/bin/activate

                    echo "📦 Installing dependencies"
                    pip install --upgrade pip
                    pip install -r requirements.txt

                    echo "🧠 Restarting services"
                    pkill streamlit || true
                    pkill cloudflared || true

                    nohup streamlit run app.py --server.port=7860 --server.address=0.0.0.0 > streamlit.log 2>&1 &
                    nohup cloudflared tunnel --url http://localhost:7860 > cloudflare.log 2>&1 &

                    echo "✅ Deployment done!"
                  EOF
